[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsc-local-commander"
version = "0.1.0"
description = "Local-only fail-closed Windows MCP workspace assistant (restricted preview)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "psutil>=6,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jsc-commander = "jsc_local_commander.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
